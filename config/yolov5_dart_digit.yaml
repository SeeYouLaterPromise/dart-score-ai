nc: 8  # 4 * 2
depth_multiple: 0.33
width_multiple: 0.50

anchors:
  - [10, 16, 13, 20, 16, 23]        # P3/8 - small digits
  - [23, 29, 26, 32, 30, 36]        # P4/16 - medium digits
  - [36, 48, 40, 56, 48, 64]        # P5/32 - larger digits (in high-res)

backbone: [
    [-1, 1, Conv, [64, 6, 2, 2]],  # 0-P1/2
    [-1, 1, Conv, [128, 3, 2]],    # 1-P2/4
    [-1, 3, C3, [128]],
    [-1, 1, Conv, [256, 3, 2]],    # 3-P3/8
    [-1, 6, C3, [256]],
    [-1, 1, Conv, [512, 3, 2]],    # 5-P4/16
    [-1, 9, C3, [512]],
    [-1, 1, Conv, [1024, 3, 2]],   # 7-P5/32
    [-1, 3, C3, [1024]],
    [-1, 1, SPPF, [1024, 5]],      # 9
]

head: [
    [-1, 1, Conv, [512, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, nearest]],
    [[-1, 6], 1, Concat, [1]],        # cat backbone P4
    [-1, 3, C3, [512, False]],

    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, nearest]],
    [[-1, 4], 1, Concat, [1]],        # cat backbone P3
    [-1, 3, C3, [256, False]],        # 17

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 14], 1, Concat, [1]],
    [-1, 3, C3, [512, False]],        # 20

    [-1, 1, Conv, [512, 3, 2]],
    [[-1, 10], 1, Concat, [1]],
    [-1, 3, C3, [1024, False]],       # 23

    [[17, 20, 23], 1, Detect, [8, anchors]],  # 8 digit classes
]
